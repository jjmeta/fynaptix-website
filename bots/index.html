<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Fynaptix · Bots</title>
<meta name="robots" content="noindex,nofollow"/>
<link rel="icon" type="image/svg+xml" href="../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root {
  --bg: #f2f1f0;
  --surface: #ffffff;
  --border: #d8d5d2;
  --text: #1a1917;
  --muted: #6b6866;
  --accent: #ec3013;
  --accent-dim: #fde8e4;
  --green: #1a7a4a;
  --green-dim: #e4f4ec;
  --red: #b91c1c;
  --red-dim: #fde8e4;
  --mono: "IBM Plex Mono", monospace;
  --sans: "Archivo", system-ui, sans-serif;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}

/* ─── AUTH WALL ─── */
#auth-wall {
  position: fixed;
  inset: 0;
  z-index: 9999;
  background: var(--bg);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
.auth-box {
  width: 100%;
  max-width: 380px;
  background: var(--surface);
  border: 1.5px solid var(--border);
}
.auth-hdr {
  padding: 28px 28px 20px;
  border-bottom: 1.5px solid var(--border);
}
.auth-kicker {
  font-size: 10px;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--accent);
  font-weight: 600;
  margin-bottom: 6px;
}
.auth-title { font-size: 28px; font-weight: 800; letter-spacing: -.02em; }
.auth-body { padding: 24px 28px; }
.auth-lbl {
  font-size: 10px;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--muted);
  font-weight: 600;
  margin-bottom: 5px;
}
.auth-input {
  display: block;
  width: 100%;
  font-family: var(--sans);
  font-size: 14px;
  font-weight: 600;
  padding: 10px 12px;
  background: var(--bg);
  border: 1.5px solid var(--border);
  color: var(--text);
  outline: none;
  transition: border-color .15s;
}
.auth-input:focus { border-color: var(--text); }
.auth-gap { height: 14px; }
.auth-btn {
  display: block;
  width: 100%;
  margin-top: 16px;
  font-family: var(--sans);
  font-size: 12px;
  font-weight: 800;
  letter-spacing: .1em;
  text-transform: uppercase;
  padding: 13px 16px;
  background: var(--text);
  color: var(--bg);
  border: none;
  cursor: pointer;
  transition: opacity .15s;
}
.auth-btn:disabled { opacity: .5; cursor: not-allowed; }
.auth-err {
  margin-top: 12px;
  font-size: 12px;
  color: var(--red);
  min-height: 18px;
}
.auth-ftr {
  padding: 14px 28px;
  border-top: 1px solid var(--border);
  font-size: 11px;
  color: var(--muted);
  letter-spacing: .04em;
}

/* ─── LAYOUT ─── */
.page-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 32px;
  height: 52px;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
  position: sticky;
  top: 0;
  z-index: 100;
}
.header-brand {
  display: flex;
  align-items: center;
  gap: 8px;
  text-decoration: none;
  color: var(--text);
}
.header-brand svg { width: 28px; height: 17px; }
.brand-name {
  font-size: 11px;
  font-weight: 800;
  letter-spacing: .12em;
  text-transform: uppercase;
}
.brand-sep {
  width: 1px;
  height: 14px;
  background: var(--border);
  margin: 0 4px;
}
.brand-page {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--muted);
}
.header-actions { display: flex; align-items: center; gap: 16px; }
.signout-btn {
  font-family: var(--sans);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--muted);
  background: none;
  border: none;
  cursor: pointer;
  padding: 4px 0;
}
.signout-btn:hover { color: var(--text); }

.page-main { padding: 32px; max-width: 1200px; margin: 0 auto; }

/* ─── SECTION HEADING ─── */
.section-hdr {
  display: flex;
  align-items: baseline;
  gap: 10px;
  margin-bottom: 16px;
}
.section-title {
  font-size: 11px;
  font-weight: 800;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--muted);
}
.section-divider { flex: 1; height: 1px; background: var(--border); }

/* ─── BOT CARDS ─── */
.bots-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
  gap: 12px;
  margin-bottom: 40px;
}
.bot-card {
  background: var(--surface);
  border: 1.5px solid var(--border);
  padding: 20px 22px;
}
.bot-card-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  margin-bottom: 16px;
}
.bot-name { font-size: 15px; font-weight: 800; letter-spacing: -.01em; }
.bot-exchange { font-size: 11px; color: var(--muted); font-weight: 600; letter-spacing: .06em; margin-top: 2px; }
.status-pill {
  font-size: 9px;
  font-weight: 800;
  letter-spacing: .1em;
  text-transform: uppercase;
  padding: 3px 8px;
  border: 1px solid;
}
.status-pill.paper { color: var(--muted); border-color: var(--border); background: var(--bg); }
.status-pill.live  { color: var(--green); border-color: var(--green); background: var(--green-dim); }
.status-pill.off   { color: var(--red); border-color: var(--red-dim); background: var(--red-dim); }

.bot-stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 0;
  border-top: 1px solid var(--border);
  padding-top: 14px;
}
.bot-stat { display: flex; flex-direction: column; gap: 2px; }
.bot-stat:not(:last-child) { padding-right: 12px; border-right: 1px solid var(--border); margin-right: 12px; }
.stat-lbl {
  font-size: 9px;
  font-weight: 700;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--muted);
}
.stat-val {
  font-size: 18px;
  font-weight: 800;
  letter-spacing: -.02em;
  font-variant-numeric: tabular-nums;
}
.stat-val.pos { color: var(--green); }
.stat-val.neg { color: var(--red); }

.bot-desc {
  font-size: 12px;
  color: var(--muted);
  margin-top: 14px;
  padding-top: 12px;
  border-top: 1px solid var(--border);
  line-height: 1.6;
}

/* ─── TRADE LOG ─── */
.trade-log-wrap {
  background: var(--surface);
  border: 1.5px solid var(--border);
  overflow: hidden;
}
.trade-log-toolbar {
  display: flex;
  align-items: center;
  gap: 0;
  border-bottom: 1px solid var(--border);
  padding: 0 4px;
}
.filter-btn {
  font-family: var(--sans);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .08em;
  text-transform: uppercase;
  padding: 10px 14px;
  background: none;
  border: none;
  border-bottom: 2px solid transparent;
  cursor: pointer;
  color: var(--muted);
  margin-bottom: -1px;
}
.filter-btn.active { color: var(--text); border-bottom-color: var(--text); }

.trade-table { width: 100%; border-collapse: collapse; }
.trade-table th {
  text-align: left;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--muted);
  padding: 10px 16px;
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
.trade-table td {
  padding: 10px 16px;
  border-bottom: 1px solid var(--border);
  font-size: 13px;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.trade-table tr:last-child td { border-bottom: none; }
.trade-table tr:hover td { background: var(--bg); }

.dir-badge {
  display: inline-block;
  font-size: 9px;
  font-weight: 800;
  letter-spacing: .08em;
  padding: 2px 6px;
  border: 1px solid;
}
.dir-badge.long  { color: var(--green); border-color: var(--green); }
.dir-badge.short { color: var(--red);   border-color: var(--red); }

.pnl-pos { color: var(--green); font-weight: 700; }
.pnl-neg { color: var(--red);   font-weight: 700; }
.pnl-nil { color: var(--muted); }

.status-open   { font-size: 10px; font-weight: 700; color: var(--accent); letter-spacing: .06em; }
.status-closed { font-size: 10px; font-weight: 600; color: var(--muted); letter-spacing: .06em; }

.empty-state {
  text-align: center;
  padding: 48px 24px;
  color: var(--muted);
  font-size: 13px;
}
.empty-icon { font-size: 24px; margin-bottom: 8px; }

/* ─── SUMMARY BAR ─── */
.summary-bar {
  display: flex;
  gap: 0;
  background: var(--surface);
  border: 1.5px solid var(--border);
  margin-bottom: 24px;
}
.summary-stat {
  flex: 1;
  padding: 16px 20px;
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  gap: 3px;
}
.summary-stat:last-child { border-right: none; }
.summary-lbl {
  font-size: 9px;
  font-weight: 700;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--muted);
}
.summary-val {
  font-size: 22px;
  font-weight: 800;
  letter-spacing: -.02em;
  font-variant-numeric: tabular-nums;
}
.summary-val.pos { color: var(--green); }
.summary-val.neg { color: var(--red); }

@media(max-width:600px){
  .page-main { padding: 16px; }
  .page-header { padding: 0 16px; }
  .bots-grid { grid-template-columns: 1fr; }
  .bot-stats { grid-template-columns: repeat(2,1fr); gap: 10px; }
  .bot-stat:nth-child(2) { border-right: none; margin-right: 0; }
  .bot-stat:not(:last-child) { padding-right: 0; border-right: none; margin-right: 0; }
  .summary-bar { flex-wrap: wrap; }
  .summary-stat { min-width: 50%; border-bottom: 1px solid var(--border); }
  .trade-table th:nth-child(n+5),
  .trade-table td:nth-child(n+5) { display: none; }
}
</style>
</head>
<body>

<!-- ─── AUTH WALL ─── -->
<div id="auth-wall">
  <div class="auth-box">
    <div class="auth-hdr">
      <div class="auth-kicker">Fynaptix · Private</div>
      <div class="auth-title">Bots</div>
    </div>
    <div class="auth-body">
      <div class="auth-lbl">Email</div>
      <input id="auth-email" class="auth-input" type="email" placeholder="you@example.com"
        autocomplete="email" onkeydown="if(event.key==='Enter')document.getElementById('auth-password').focus()">
      <div class="auth-gap"></div>
      <div class="auth-lbl">Password</div>
      <input id="auth-password" class="auth-input" type="password" placeholder="••••••••"
        autocomplete="current-password" onkeydown="if(event.key==='Enter')signIn()">
      <button id="auth-btn" class="auth-btn" onclick="signIn()">Sign in →</button>
      <div id="auth-err" class="auth-err"></div>
    </div>
    <div class="auth-ftr">Private access · Fynaptix bots dashboard</div>
  </div>
</div>

<!-- ─── APP ─── -->
<div id="app-root" hidden>

  <header class="page-header">
    <a class="header-brand" href="/">
      <svg viewBox="0 0 40 24" role="img" aria-label="Fynaptix">
        <circle cx="13" cy="12" r="9.2" fill="none" stroke="#71717a" stroke-width="2.6"/>
        <circle cx="27" cy="12" r="9.2" fill="none" stroke="#a1a1aa" stroke-width="2.6"/>
      </svg>
      <span class="brand-name">Fynaptix</span>
      <span class="brand-sep"></span>
      <span class="brand-page">Bots</span>
    </a>
    <div class="header-actions">
      <button class="signout-btn" onclick="signOut()">Sign out</button>
    </div>
  </header>

  <main class="page-main">

    <!-- Summary bar -->
    <div class="summary-bar" id="summary-bar">
      <div class="summary-stat">
        <div class="summary-lbl">Total P&amp;L</div>
        <div class="summary-val" id="sum-pnl">—</div>
      </div>
      <div class="summary-stat">
        <div class="summary-lbl">Closed Trades</div>
        <div class="summary-val" id="sum-trades">—</div>
      </div>
      <div class="summary-stat">
        <div class="summary-lbl">Win Rate</div>
        <div class="summary-val" id="sum-winrate">—</div>
      </div>
      <div class="summary-stat">
        <div class="summary-lbl">Open Positions</div>
        <div class="summary-val" id="sum-open">—</div>
      </div>
    </div>

    <!-- Bot cards -->
    <div class="section-hdr">
      <span class="section-title">Bots</span>
      <span class="section-divider"></span>
    </div>
    <div class="bots-grid" id="bots-grid"></div>

    <!-- Trade log -->
    <div class="section-hdr">
      <span class="section-title">Trade Log</span>
      <span class="section-divider"></span>
    </div>
    <div class="trade-log-wrap">
      <div class="trade-log-toolbar">
        <button class="filter-btn active" onclick="setFilter('all',this)">All</button>
        <button class="filter-btn" onclick="setFilter('gate-etf-01',this)">Gate.io</button>
        <button class="filter-btn" onclick="setFilter('bybit-mom-01',this)">Bybit</button>
        <button class="filter-btn" onclick="setFilter('mexc-trend-01',this)">MEXC</button>
        <button class="filter-btn" onclick="setFilter('open',this)">Open</button>
      </div>
      <div id="trade-log-body" style="overflow-x:auto;">
        <div class="empty-state"><div class="empty-icon">⏳</div>Loading trades…</div>
      </div>
    </div>

  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
// ─── SUPABASE AUTH ───
const SUPABASE_URL  = 'https://msnzqkpfznomvykqjvlw.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1zbnpxa3Bmem5vbXZ5a3Fqdmx3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA2NDE4NjIsImV4cCI6MjEwNjIxNzg2Mn0.Xt8wRZv-p5lkSFm7dNg6wNwokQ8yxAx5u9doRcuSRzk';
const _sb = window.supabase?.createClient(SUPABASE_URL, SUPABASE_ANON);

function _showApp() {
  document.getElementById('auth-wall').hidden = true;
  document.getElementById('app-root').hidden  = false;
  loadData();
  setInterval(loadData, 120000);
}
function _showWall() {
  document.getElementById('auth-wall').hidden = false;
  document.getElementById('app-root').hidden  = true;
}

async function signIn() {
  const email    = (document.getElementById('auth-email').value||'').trim();
  const password = document.getElementById('auth-password').value||'';
  if(!email||!password) return;
  const btn = document.getElementById('auth-btn');
  const err = document.getElementById('auth-err');
  btn.disabled = true; btn.textContent = 'Signing in…'; err.textContent = '';
  try {
    const {data, error} = await _sb.auth.signInWithPassword({email, password});
    if(error) {
      err.textContent = error.message;
      btn.disabled = false; btn.textContent = 'Sign in →';
    } else if(data?.session) {
      _showApp();
    } else {
      err.textContent = 'No session returned.';
      btn.disabled = false; btn.textContent = 'Sign in →';
    }
  } catch(e) {
    err.textContent = 'Error: '+(e.message||e);
    btn.disabled = false; btn.textContent = 'Sign in →';
  }
}

async function signOut() { await _sb?.auth.signOut(); }

_sb?.auth.onAuthStateChange((event, session) => {
  if(event === 'SIGNED_IN'  && session) _showApp();
  if(event === 'SIGNED_OUT')            _showWall();
});

(async () => {
  if(!_sb) { _showApp(); return; }
  const {data:{session}} = await _sb.auth.getSession();
  if(session) _showApp(); else _showWall();
})();

// ─── BOT DEFINITIONS ───
const BOT_DEFS = [
  {
    id: 'gate-etf-01',
    name: 'Gate.io Leveraged ETF',
    exchange: 'Gate.io',
    status: 'paper',
    desc: 'EMA 8/21 crossover · Bybit OI filter · Claude AI confirmation · routes to 5L/5S ETF tokens',
    table: 'trades',
  },
  {
    id: 'bybit-mom-01',
    name: 'Bybit Momentum Perps',
    exchange: 'Bybit',
    status: 'paper',
    desc: 'RSI momentum cross · EMA50 trend filter · 2× leverage on top-50 linear perps · native SL/TP',
    table: 'bybit_trades',
  },
  {
    id: 'mexc-trend-01',
    name: 'MEXC CoinGecko Trend',
    exchange: 'MEXC',
    status: 'paper',
    desc: 'CoinGecko narrative scoring · trending rank + vol/mcap + category momentum · spot only',
    table: 'mexc_trades',
  },
];

// ─── DATA ───
let ALL_TRADES = [];
let activeFilter = 'all';

async function loadData() {
  if(!_sb) { renderAll([]); return; }
  try {
    const [gateRes, bybitRes, mexcRes] = await Promise.all([
      _sb.from('trades').select('*').order('opened_at',{ascending:false}).limit(300),
      _sb.from('bybit_trades').select('*').order('opened_at',{ascending:false}).limit(300),
      _sb.from('mexc_trades').select('*').order('opened_at',{ascending:false}).limit(300),
    ]);

    const gateTrades  = (gateRes.data||[]).map(t=>normGate(t));
    const bybitTrades = (bybitRes.data||[]).map(t=>normBybit(t));
    const mexcTrades  = (mexcRes.data||[]).map(t=>normMexc(t));

    ALL_TRADES = [...gateTrades, ...bybitTrades, ...mexcTrades]
      .sort((a,b)=> new Date(b.openedAt) - new Date(a.openedAt));

    renderAll(ALL_TRADES);
  } catch(e) {
    console.error('loadData error', e);
  }
}

function normGate(t) {
  return {
    botId: 'gate-etf-01',
    symbol: t.underlying_pair||t.etf_pair||'—',
    dir: t.direction==='long'?'LONG':'SHORT',
    entry: t.entry_price,
    exit: t.exit_price||null,
    pnlUsd: t.pnl_usdt??null,
    pnlPct: t.pnl_pct!=null ? t.pnl_pct*100 : null,
    openedAt: t.opened_at||'',
    status: t.closed_at ? 'closed' : 'open',
  };
}
function normBybit(t) {
  return {
    botId: 'bybit-mom-01',
    symbol: t.pair||'—',
    dir: t.direction==='long'?'LONG':'SHORT',
    entry: t.entry_price,
    exit: t.exit_price||null,
    pnlUsd: t.pnl_usdt??null,
    pnlPct: t.pnl_pct!=null ? t.pnl_pct*100 : null,
    openedAt: t.opened_at||'',
    status: t.closed_at ? 'closed' : 'open',
  };
}
function normMexc(t) {
  return {
    botId: 'mexc-trend-01',
    symbol: t.pair||'—',
    dir: 'LONG',
    entry: t.entry_price,
    exit: t.exit_price||null,
    pnlUsd: t.pnl_usdt??null,
    pnlPct: t.pnl_pct!=null ? t.pnl_pct*100 : null,
    openedAt: t.opened_at||'',
    status: t.closed_at ? 'closed' : 'open',
  };
}

// ─── RENDER ───
function renderAll(trades) {
  renderSummary(trades);
  renderBotCards(trades);
  renderTradeLog(trades, activeFilter);
}

function renderSummary(trades) {
  const closed  = trades.filter(t=>t.status==='closed'&&t.pnlUsd!=null);
  const open    = trades.filter(t=>t.status==='open');
  const totalPnl = closed.reduce((s,t)=>s+(t.pnlUsd||0),0);
  const wins    = closed.filter(t=>t.pnlUsd>0).length;
  const winRate = closed.length ? Math.round(wins/closed.length*100) : null;

  const fmt = n => (n>=0?'+':'')+n.toFixed(2);

  const pnlEl = document.getElementById('sum-pnl');
  pnlEl.textContent = closed.length ? fmt(totalPnl)+' USDT' : '—';
  pnlEl.className = 'summary-val'+(totalPnl>0?' pos':totalPnl<0?' neg':'');

  document.getElementById('sum-trades').textContent = closed.length||'0';
  document.getElementById('sum-winrate').textContent = winRate!=null ? winRate+'%' : '—';
  document.getElementById('sum-open').textContent = open.length||'0';
}

function renderBotCards(trades) {
  const grid = document.getElementById('bots-grid');
  grid.innerHTML = BOT_DEFS.map(bot => {
    const bt = trades.filter(t=>t.botId===bot.id);
    const closed = bt.filter(t=>t.status==='closed'&&t.pnlUsd!=null);
    const open   = bt.filter(t=>t.status==='open');
    const pnl    = closed.reduce((s,t)=>s+(t.pnlUsd||0),0);
    const wins   = closed.filter(t=>t.pnlUsd>0).length;
    const wr     = closed.length ? Math.round(wins/closed.length*100) : null;

    const pnlStr = closed.length ? (pnl>=0?'+':'')+pnl.toFixed(2) : '—';
    const pnlCls = pnl>0?'pos':pnl<0?'neg':'';

    return `<div class="bot-card">
      <div class="bot-card-top">
        <div>
          <div class="bot-name">${bot.name}</div>
          <div class="bot-exchange">${bot.exchange}</div>
        </div>
        <span class="status-pill ${bot.status}">${bot.status.toUpperCase()}</span>
      </div>
      <div class="bot-stats">
        <div class="bot-stat">
          <div class="stat-lbl">P&amp;L</div>
          <div class="stat-val ${pnlCls}">${pnlStr}</div>
        </div>
        <div class="bot-stat">
          <div class="stat-lbl">Trades</div>
          <div class="stat-val">${closed.length}</div>
        </div>
        <div class="bot-stat">
          <div class="stat-lbl">Win Rate</div>
          <div class="stat-val">${wr!=null?wr+'%':'—'}</div>
        </div>
        <div class="bot-stat">
          <div class="stat-lbl">Open</div>
          <div class="stat-val">${open.length}</div>
        </div>
      </div>
      <div class="bot-desc">${bot.desc}</div>
    </div>`;
  }).join('');
}

function setFilter(f, el) {
  activeFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
  renderTradeLog(ALL_TRADES, f);
}

function renderTradeLog(trades, filter) {
  const filtered = filter==='open'
    ? trades.filter(t=>t.status==='open')
    : filter==='all'
    ? trades
    : trades.filter(t=>t.botId===filter);

  const body = document.getElementById('trade-log-body');
  if(!filtered.length) {
    body.innerHTML = `<div class="empty-state"><div class="empty-icon">📭</div>No trades yet</div>`;
    return;
  }

  const botLabel = {
    'gate-etf-01': 'Gate.io',
    'bybit-mom-01': 'Bybit',
    'mexc-trend-01': 'MEXC',
  };

  const rows = filtered.map(t => {
    const pnlStr = t.pnlUsd!=null ? (t.pnlUsd>=0?'+':'')+t.pnlUsd.toFixed(2) : '—';
    const pnlPctStr = t.pnlPct!=null ? (t.pnlPct>=0?'+':'')+t.pnlPct.toFixed(2)+'%' : '';
    const pnlCls = t.pnlUsd==null?'pnl-nil':t.pnlUsd>0?'pnl-pos':'pnl-neg';
    const dirCls = t.dir==='LONG'?'long':'short';
    const statusEl = t.status==='open'
      ? `<span class="status-open">OPEN</span>`
      : `<span class="status-closed">CLOSED</span>`;
    const dateStr = t.openedAt ? t.openedAt.slice(0,10) : '—';
    const entryStr = t.entry ? Number(t.entry).toFixed(4) : '—';
    const exitStr  = t.exit  ? Number(t.exit).toFixed(4)  : '—';

    return `<tr>
      <td>${dateStr}</td>
      <td><strong>${t.symbol}</strong></td>
      <td><span class="dir-badge ${dirCls}">${t.dir}</span></td>
      <td style="font-family:var(--mono);font-size:12px;">${entryStr}</td>
      <td style="font-family:var(--mono);font-size:12px;">${exitStr}</td>
      <td class="${pnlCls}">${pnlStr} <span style="font-size:11px;opacity:.7;">${pnlPctStr}</span></td>
      <td>${statusEl}</td>
      <td style="color:var(--muted);font-size:12px;">${botLabel[t.botId]||t.botId}</td>
    </tr>`;
  }).join('');

  body.innerHTML = `<table class="trade-table">
    <thead><tr>
      <th>Date</th><th>Pair</th><th>Dir</th><th>Entry</th><th>Exit</th><th>P&amp;L</th><th>Status</th><th>Bot</th>
    </tr></thead>
    <tbody>${rows}</tbody>
  </table>`;
}
</script>
</body>
</html>
